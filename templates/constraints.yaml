# 制約・禁じ手リスト — 「この設定が存在する限り、この展開は起こりえない」の台帳
#
# キャラ属性ではなく“世界にかかる制約”を否定形で書く。
# 登場しない章でも効くため、コンテキストパックでは常時フルロードされる。
#
# 例:
#   - id: C001
#     rule: "レンは嘘を見抜ける。レンが同席する場面で、欺瞞が成功する展開は成立しない"
#     holds_while: "レンがその場に同席している間"
#     involves: [ren]
#   - id: C002
#     rule: "転移門は王都と港町の間にしか存在しない。他都市間の即日移動は不可能"
#     holds_while: 常時
#     involves: []
constraints: []
