# 文体・作風 — writer と style-auditor が参照する
narration:
  person: ""          # 例: 三人称一元(視点キャラ固定) / 一人称
  tense: ""           # 例: 過去形基調
  tone: ""            # 例: 硬質で抑制的。感傷に流れない
  pov_rule: ""        # 例: 章内での視点切替禁止。視点キャラが知覚できない情報は書かない

# lint が機械検出する定量ルール(数値を変えれば基準が変わる。行を消せばそのチェックは無効)
quantitative:
  max_commas_per_dialogue: 2   # 台詞1本あたりの読点上限(超過は WARN)
  max_consecutive_tta: 3       # 「った。」で終わる文の連続上限(超過は WARN)

# 専門描写の深さ(interview で必ず確認する)
# 例: "学問・講義の具体的内容を専門的に書かない。疑似専門性は禁止"
expertise_policy: ""

# 執筆規則 — writer が最優先で守る自由記述ルール。
# /novelist:learn-style で抽出した規則は必ず「実例(AI稿→改稿後)」付きでここに追記する
writing_rules:
  - "地の文で出来事の『意味』を言い直さない(平易な因果の説明はよい。箴言・文学的意味づけは不可)"
  - "台詞は『普通の人が普通に言う言葉か』を基準にする。性質を宣言する決め台詞は書かない"
  - "大きな転換(告白・キス・断絶など)を単文で通過させない。ただし会話の垂れ流しで延ばさない — 転換に足る出来事を間に置く"

# 地の文の禁止表現(常套句・作風に合わない言い回し)
prohibited_expressions:
  - ""

# 参考にする作風・意識すること
notes: |
  (例: 会話は短く応酬させる。情景描写は五感のうち音を優先。説明台詞を避ける)
